function bandera(nombre){
  const c = ISO[nombre];
  return c ? String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0))) : "🌍";
}

// Historial (se guarda en el propio móvil)
function cargarHist(){ try{ return JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){ return []; } }
function guardar(codigo, pais, fab){
  const h = cargarHist().filter(x => x.codigo !== codigo);
  h.unshift({codigo, pais, fab, fecha:new Date().toLocaleString("es-ES")});
  try{ localStorage.setItem("hist", JSON.stringify(h.slice(0,50))); }catch(e){}
  pintarHist();
}
function pintarHist(){
  const h = cargarHist();
  document.getElementById("hist").innerHTML = h.length
    ? h.map(x => '<div class="item">'+bandera(x.pais)+' <b>'+x.pais+'</b>'+(x.fab?(x.fab.indexOf('según')===0?' · 🏷️ ':' · 🏭 ')+x.fab:'')+'<small>'+x.codigo+' · '+x.fecha+'</small></div>').join("")
    : '<small>Aún no has escaneado nada.</small>';
}
document.getElementById("borrar").onclick = () => { try{ localStorage.removeItem("hist"); }catch(e){} pintarHist(); };
pintarHist();

function paisDe(codigo){
  const c = codigo.replace(/\D/g,"");
  if(c.length < 8) return null;
  // UPC-A (12 dígitos) equivale a EAN-13 con un 0 delante
  const ean = c.length === 12 ? "0"+c : c;
  const p = parseInt(ean.slice(0,3),10);
  const f = R.find(([a,b]) => p>=a && p<=b);
  return f ? f[2] : "Desconocido / código especial";
}

function hablar(texto){
  if(!vozActiva) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    speechSynthesis.speak(u);
  }catch(e){}
}
function fanfarriaEspana(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    const ahora = ctx.currentTime;
    // Pequeña fanfarria ascendente, generada en el propio navegador.
    const notas = [
      [392,0.00,0.18],[523.25,0.18,0.18],[659.25,0.36,0.22],
      [523.25,0.62,0.16],[659.25,0.78,0.16],[783.99,0.94,0.42]
    ];
    notas.forEach(([freq, inicio, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, ahora + inicio);
      gain.gain.setValueAtTime(0.0001, ahora + inicio);
      gain.gain.exponentialRampToValueAtTime(0.16, ahora + inicio + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, ahora + inicio + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ahora + inicio);
      osc.stop(ahora + inicio + dur + 0.02);
    });
    setTimeout(() => { try{ctx.close();}catch(e){} }, 1800);
  }catch(e){}
}

function pitidoEmergencia(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    const ahora = ctx.currentTime;
    [0, 0.28, 0.56].forEach((d, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = i % 2 === 0 ? 880 : 660;
      gain.gain.setValueAtTime(0.0001, ahora + d);
      gain.gain.exponentialRampToValueAtTime(0.18, ahora + d + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ahora + d + 0.18);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ahora + d);
      osc.stop(ahora + d + 0.2);
    });
    setTimeout(() => { try{ctx.close();}catch(e){} }, 1200);
  }catch(e){}
}

const norm = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Busca el primer país que aparece nombrado en un texto libre
function detectar(texto){
  const t = norm(texto);
  let mejor = null, pos = 1e9;
  for(const [pais, alias] of ALIAS){
    for(const a of alias){
      const m = new RegExp("(^|[^a-z])"+a.replace(/[.]/g,"\\.")+"([^a-z]|$)").exec(t);
      if(m && m.index < pos){ pos = m.index; mejor = pais; }
    }
  }
  return mejor;
}
// Código de envasador/sanitario de la UE: "ES 10.02547/H CE", "FR 35.123.001 CE", "EMB 35123"
function deEmb(texto){
  const t = String(texto||"").toUpperCase();
  if(/EMB\s?\d/.test(t)) return "Francia";
  const m = t.match(/(?:^|[^A-Z])([A-Z]{2})\s?\d/);
  return (m && EMB[m[1]]) || null;
}
// Etiquetas tipo "en:made-in-spain"
function deEtiqueta(tags){
  for(const t of (tags||[])){
    const m = String(t).match(/made-in-([a-z-]+)/);
    if(m){ const p = detectar(m[1].replace(/-/g," ")); if(p) return p; }
  }
  return null;
}

async function buscarProducto(codigo){
  const bases = ["openfoodfacts","openbeautyfacts","openproductsfacts"];
  const res = await Promise.all(bases.map(async b => {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 5000);
    try{
      const r = await fetch("https://world."+b+".org/api/v2/product/"+codigo+".json?fields=product_name,manufacturing_places,origins,emb_codes,labels_tags", {signal: ac.signal});
      const d = await r.json();
      return d.status === 1 ? d.product : null;
    }catch(e){ return null; }
    finally{ clearTimeout(t); }
  }));
  const ps = res.filter(Boolean);
  const campo = c => ps.map(p => p[c]).find(v => v && (!Array.isArray(v) || v.length)) || "";
  const nombre = campo("product_name"), fab = campo("manufacturing_places"), ori = campo("origins");
  let prod = null, p;
  if((p = detectar(fab))) prod = {pais:p, fuente:"lugar de fabricación"};
  else if((p = deEtiqueta(campo("labels_tags")))) prod = {pais:p, fuente:"etiqueta «Hecho en»"};
  else if((p = deEmb(campo("emb_codes")))) prod = {pais:p, fuente:"código de envasador"};
  return {nombre, fab, ori, prod};
}

  const info = await buscarProducto(codigo);
  const g = cargarFab(codigo);
  if(g) info.prod = g; // lo que leíste tú en la etiqueta manda
  actual = {codigo, prefijo, info};
  pintar();
}

function pintar(){
  const {codigo, prefijo, info} = actual;
  const cuadro = $("resultado");
  const confirmado = !!info.prod;
  const pais = confirmado ? (info.prod.pais === "España / Andorra" ? "España" : info.prod.pais) : (prefijo === "España / Andorra" ? "España" : prefijo);
  const desconocido = !confirmado && prefijo.startsWith("Desconocido");
  const nombre = pais === "España / Andorra" ? "España" : pais.split(" / ")[0];

  $("pais").textContent = desconocido ? "🌍 País desconocido" : bandera(pais) + " " + pais;
  let frase = "";
  cuadro.className = "";
  if(!desconocido){
    frase = pais === "España" ? "¡Viva España!" : (pais === "Marruecos" ? "¡No, no, no, Marruecos no!" : "¡No!");
    cuadro.className = pais === "España" ? "ok" : "mal";
  }
  $("frase").textContent = frase;

  const detalle = confirmado
    ? "Producido en " + nombre
    : (desconocido ? "No sé de qué país es" : "Según el código de barras, es de " + nombre);
  let html = info.nombre ? "<b>"+esc(info.nombre)+"</b><br>" : "";
  if(confirmado) html += "🏭 Producido en <b>"+esc(pais)+"</b> <small>("+info.prod.fuente+")</small>";
  else html += "🏷️ Según el código de barras. <small>No consta dónde se fabricó: el prefijo solo indica dónde se registró la marca.</small>";
  if(info.fab) html += "<br>📍 " + esc(info.fab);
  if(info.ori) html += "<br>🌾 Ingredientes de: " + esc(info.ori);
  $("fabrica").innerHTML = html;

  if(pais === "España") fanfarriaEspana();
  if(pais === "Marruecos") pitidoEmergencia();
  hablar((frase ? frase + " " : "") + detalle);
  guardar(codigo, desconocido ? "Desconocido" : pais, confirmado ? "producido en " + nombre : "según el código");
}

let scanner, activo = false, ultimo = "";
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const btn = document.getElementById("btn");
async function parar(){
  if(!activo) return;
  activo = false;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  btn.textContent = "📷 Escanear otro";
}
async function iniciar(){
  if(activo) return;
  activo = true;
  btn.textContent = "Parar cámara";
  scanner = new Html5Qrcode("lector", {
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E],
    experimentalFeatures: {useBarCodeDetectorIfSupported: true},
    verbose: false
  });
  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:260,height:140}},
      async txt => {
        if(!activo) return;
        await parar();
        if(navigator.vibrate) navigator.vibrate(150);
        mostrar(txt);
      }
    );
  }catch(e){
    activo = false;
    btn.textContent = "Activar cámara";
    alert("No se pudo abrir la cámara. Revisa los permisos (hace falta https).");
  }
}
const vozBtn = document.getElementById("vozBtn");
if(vozBtn){
  actualizarBotonVoz();
  vozBtn.onclick = () => {
    vozActiva = !vozActiva;
    localStorage.setItem("vozActiva", vozActiva ? "1" : "0");
    if(!vozActiva){
      try{ speechSynthesis.cancel(); }catch(e){}
    }
    actualizarBotonVoz();
  };
}

btn.onclick = () => activo ? parar() : iniciar();
window.addEventListener("load", iniciar);
document.getElementById("ok").onclick = () => mostrar(document.getElementById("manual").value);
</script>
