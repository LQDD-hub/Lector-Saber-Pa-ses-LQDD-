function bandera(nombre){
  const c = ISO[nombre];
  return c ? String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0))) : "🌍";

// Historial (se guarda en el propio móvil)
function cargarHist(){ try{ return JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){ return []; } }
function guardar(codigo, pais, fab){
  const h = cargarHist().filter(x => x.codigo !== codigo);
  h.unshift({codigo, pais, fab, fecha:new Date().toLocaleString("es-ES")});
  try{ localStorage.setItem("hist", JSON.stringify(h.slice(0,50))); }catch(e){}
  pintarHist();
}
function pintarHist(){
  const h = cargarHist();
  document.getElementById("hist").innerHTML = h.length
    ? h.map(x => '<div class="item">'+bandera(x.pais)+' <b>'+x.pais+'</b>'+(x.fab?(x.fab.indexOf('según')===0?' · 🏷️ ':' · 🏭 ')+x.fab:'')+'<small>'+x.codigo+' · '+x.fecha+'</small></div>').join("")
    : '<small>Aún no has escaneado nada.</small>';
}
document.getElementById("borrar").onclick = () => { try{ localStorage.removeItem("hist"); }catch(e){} pintarHist(); };

function paisDe(codigo){
  const c = codigo.replace(/\D/g,"");
  if(c.length < 8) return null;
  // UPC-A (12 dígitos) equivale a EAN-13 con un 0 delante
  const ean = c.length === 12 ? "0"+c : c;
  const p = parseInt(ean.slice(0,3),10);
  const f = R.find(([a,b]) => p>=a && p<=b);
  return f ? f[2] : "Desconocido / código especial";
}

      osc.type = "triangle";

      gain.gain.setValueAtTime(0.0001, ahora + inicio);

const norm = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

// Busca el primer país que aparece nombrado en un texto libre
function detectar(texto){
  const t = norm(texto);
  let mejor = null, pos = 1e9;
  for(const [pais, alias] of ALIAS){
    for(const a of alias){
      const m = new RegExp("(^|[^a-z])"+a.replace(/[.]/g,"\\.")+"([^a-z]|$)").exec(t);
      if(m && m.index < pos){ pos = m.index; mejor = pais; }
    }
  }
  return mejor;
}
// Código de envasador/sanitario de la UE: "ES 10.02547/H CE", "FR 35.123.001 CE", "EMB 35123"
function deEmb(texto){
  const t=String(texto||"").toUpperCase();
  const m=t.match(/(?:^|[^A-Z])([A-Z]{2})\s?\d/);
  return (m&&EMB[m[1]])||null;
}
// Etiquetas tipo "en:made-in-spain"
function deEtiqueta(tags){
  for(const t of (tags||[])){
    const m = String(t).match(/made-in-([a-z-]+)/);
    if(m){ const p = detectar(m[1].replace(/-/g," ")); if(p) return p; }
  }
  return null;
}

function paisDeTags(tags){
  if(!Array.isArray(tags)) return null;
  for(const tag of tags){
    const raw=String(tag||"").toLowerCase();
    const limpio=raw.replace(/^([a-z]{2}):/i,"").replace(/^made-in-/,"").replace(/-/g," ");
    const p=detectar(limpio);
    if(p && p!=="Unión Europea") return p;
  }
  return null;
}

async function buscarUPCitemdb(codigo){
  const c=String(codigo||"").replace(/\D/g,"");
  if(!c) return null;
  try{
    const ac=new AbortController(), t=setTimeout(()=>ac.abort(),4000);
    const r=await fetch("https://api.upcitemdb.com/prod/trial/lookup?upc="+encodeURIComponent(c),{signal:ac.signal,headers:{"Accept":"application/json"}});
    clearTimeout(t);
    if(!r.ok) return null;
    const d=await r.json();
    const item=d && Array.isArray(d.items) ? d.items[0] : null;
    return item || null;
  }catch(e){ return null; }
}

function textoUPC(item){
  if(!item) return "";
  return [item.title,item.brand,item.category,item.description,item.manufacturer,item.model,item.size].filter(Boolean).join(" | ");
}

const PAISES_BUSQUEDA={
  "España":["españa","spain"],"Portugal":["portugal"],"Francia":["francia","france"],"Italia":["italia","italy"],
  "Alemania":["alemania","germany","deutschland"],"Marruecos":["marruecos","morocco"],"China":["china"],"Países Bajos":["países bajos","netherlands"],
  "Bélgica":["bélgica","belgium"],"Polonia":["polonia","poland"],"Reino Unido":["reino unido","united kingdom"],"Estados Unidos":["estados unidos","united states","usa"],
  "Suiza":["suiza","switzerland"],"Turquía":["turquía","turkey"],"Grecia":["grecia","greece"],"Rumanía":["rumanía","romania"],
  "México":["méxico","mexico"],"Argentina":["argentina"],"Brasil":["brasil","brazil"],"India":["india"],"Japón":["japón","japan"],"Canadá":["canadá","canada"]
};
function paisesWeb(txt){
  const t=norm(txt), out=[];
  for(const [p,vs] of Object.entries(PAISES_BUSQUEDA)) if(vs.some(v=>t.includes(norm(v)))) out.push(p);
  return [...new Set(out)];
}
function señalesWeb(txt){
  const t=norm(txt);
  return ["fabricad","manufactur","made in","manufacturer","factory","fabrica","envasad","embotell","bottled","production plant","planta de produccion","planta de fabricacion","produced by","manufactured by"]
    .filter(x=>t.includes(norm(x))).length;
}
function extraerUrls(txt){
  const out=[],seen=new Set();
  const add=u=>{
    try{
      u=String(u).replace(/&amp;/g,"&").replace(/[),.;]+$/g,"");
      const x=new URL(u); const red=x.searchParams.get("uddg")||x.searchParams.get("url"); if(red)u=decodeURIComponent(red);
      if(!/^https?:\/\//i.test(u)||/jina\.ai|duckduckgo\.|google\.|bing\./i.test(new URL(u).hostname))return;
      u=new URL(u).href; if(!seen.has(u)){seen.add(u);out.push(u);}
    }catch(e){}
  };
  const re=/(https?:\/\/[^\s<>"'\]\)]+)/g; let m;
  while((m=re.exec(txt))&&out.length<12)add(m[1]);
  const md=/\[[^\]]{2,250}\]\((https?:\/\/[^\s)]+)\)/g;
  while((m=md.exec(txt))&&out.length<12)add(m[1]);
  return out;
}
async function leerWeb(url,ms=5000){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch("https://r.jina.ai/"+url,{signal:ac.signal});return r.ok?(await r.text()).slice(0,90000):"";}catch(e){return ""}finally{clearTimeout(t)}
}
async function buscarEvidenciaFabricanteWeb(codigo,nombre,marca){
  if(!codigo&&!nombre&&!marca)return null;
  const q=encodeURIComponent('"'+codigo+'" '+[marca,nombre].filter(Boolean).join(" ")+" Mercadona Carrefour fabricante proveedor fábrica fabricación envasado origen España");
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),5000);
  try{
    const r=await fetch("https://r.jina.ai/https://html.duckduckgo.com/html/?q="+q,{signal:ac.signal});
    if(!r.ok)return null;
    const resultados=(await r.text()).slice(0,60000);
    const urls=extraerUrls(resultados).slice(0,5);
    // Primero usamos el propio texto de resultados; solo abrimos 2 páginas.
    const candidatos=[resultados,...await Promise.all(urls.slice(0,2).map(u=>leerWeb(u,5000)))].filter(Boolean);
    let mejor=null;
    for(const txt of candidatos){
      const t=norm(txt), relCodigo=codigo&&t.includes(norm(codigo)), relNombre=nombre&&t.includes(norm(nombre)), relMarca=marca&&t.includes(norm(marca));
      if(!relCodigo&&!relNombre&&!relMarca)continue;
      const sig=señalesWeb(txt); if(sig<1)continue;
      const paises=paisesWeb(txt); if(!paises.length)continue;
      for(const pais of paises){
        let score=sig*2+(relCodigo?6:0)+(relNombre?3:0)+(relMarca?3:0); if(/mercadona|hacendado|bosque verde|deliplus|compy|carrefour|de nuestra tierra/i.test(txt)) score+=3;
        // Una página del fabricante suele contener la marca/producto y términos de fabricación.
        if(/\b(fabricante|manufacturer|manufactured by|factory|fábrica|planta de producción)\b/i.test(txt))score+=2;
        if(!mejor||score>mejor.score)mejor={pais,score};
      }
    }
    if(!mejor||mejor.score<6)return null;
    return {pais:mejor.pais,nivel:mejor.score>=10?"confirmado":"deducido",fuente:"Web · investigación de fabricante",detalle:"La búsqueda web encontró referencias del producto/marca junto con información de fabricación, producción o envasado.",lugar:null};
  }catch(e){return null}finally{clearTimeout(t)}
}

async function buscarProducto(codigo){
  const bases=["openfoodfacts","openbeautyfacts","openproductsfacts"];
  const campos="product_name,abbreviated_product_name,generic_name,brands,quantity,product_quantity,product_quantity_unit,categories,categories_tags,manufacturing_places,manufacturing_places_tags,cities_tags,origins,origins_tags,origin,labels,labels_tags,emb_codes,emb_codes_tags,emb_codes_orig,packaging_text,customer_service,producer,stores,link,knowledge_panels";
  const [res,upc]=await Promise.all([
    Promise.all(bases.map(async b=>{
      const ac=new AbortController(), t=setTimeout(()=>ac.abort(),4500);
      try{
        const url="https://world."+b+".org/api/v3/product/"+encodeURIComponent(codigo)+"?fields="+encodeURIComponent(campos)+"";
        const r=await fetch(url,{signal:ac.signal});
        if(!r.ok)return null;
        const d=await r.json();
        return d&&d.product?{base:b,product:d.product}:null;
      }catch(e){return null;} finally{clearTimeout(t);}
    })),
    buscarUPCitemdb(codigo)
  ]);

  const registros=res.filter(Boolean);
  const ps=registros.map(x=>x.product);
  const has=v=>v&&((Array.isArray(v)&&v.length)||(!Array.isArray(v)&&String(v).trim()));
  const score=p=>[
    "product_name","brands","generic_name","quantity","categories",
    "manufacturing_places","manufacturing_places_tags","cities_tags",
    "emb_codes","emb_codes_tags","origins","packaging_text","customer_service","producer"
  ].reduce((n,k)=>n+(has(p[k])?1:0),0);
  ps.sort((a,b)=>score(b)-score(a));
  const campo=k=>ps.map(p=>p[k]).find(has)||"";

  const upcText=textoUPC(upc);
  const upcCountry=upc ? detectar(upcText) : null;
  const nombre=campo("product_name")||campo("abbreviated_product_name")||(upc&&upc.title)||"";
  const marca=campo("brands")||(upc&&upc.brand)||"";
  const denominacion=campo("generic_name")||"";
  const cantidad=campo("quantity")||([campo("product_quantity"),campo("product_quantity_unit")].filter(Boolean).join(" "))||(upc&&upc.size)||"";
  const categoria=campo("categories")||(Array.isArray(campo("categories_tags"))?campo("categories_tags").join(", "):"")||(upc&&upc.category)||"";
  const fab=campo("manufacturing_places"), fabTags=campo("manufacturing_places_tags");
  const ciudades=campo("cities_tags");
  const ori=campo("origins")||campo("origin"), oriTags=campo("origins_tags");
  const labels=campo("labels_tags")||campo("labels");
  const emb=campo("emb_codes"), embTags=campo("emb_codes_tags"), embOrig=campo("emb_codes_orig");
  const packaging=campo("packaging_text"), customer=campo("customer_service"), producer=campo("producer");

  let evidencias=[];
  let p;
  // 1) Declaración directa: máxima evidencia.
  if((p=detectar(fab))) evidencias.push({pais:p,nivel:"confirmado",fuente:"Lugar de fabricación declarado",detalle:fab});
  else if(fab && String(fab).trim()) evidencias.push({pais:null,nivel:"confirmado",fuente:"Lugar de fabricación declarado",detalle:String(fab)});
  if(!evidencias.length && (p=deEtiqueta(labels))) evidencias.push({pais:p,nivel:"asociado",fuente:"Etiqueta made-in del producto",detalle:String(labels)});
  if(!evidencias.length && Array.isArray(fabTags) && (p=paisDeTags(fabTags))) evidencias.push({pais:p,nivel:"confirmado",fuente:"Etiquetas del lugar de fabricación",detalle:fabTags.join(", ")});

  // 2) Código sanitario/establecimiento. Es una pista del establecimiento, no una prueba automática de fabricación.
  const sanitario=String(emb||embOrig||"");
  const sm=sanitario.match(/(?:^|[^A-Z])([A-Z]{2})\s?\d[\d.]*\s*(?:CE)?/i);
  if(sm && EMB[sm[1].toUpperCase()]){
    const ep=EMB[sm[1].toUpperCase()];
    evidencias.push({pais:ep,nivel:"asociado",fuente:"Código de establecimiento/envasador",detalle:sanitario});
  }
  let embInfo=null;

  // 3) Ciudad o dirección explícita vinculada al fabricante/envasador.
  const ubicacionTexto=[fab,Array.isArray(fabTags)?fabTags.join(" "):fabTags,Array.isArray(ciudades)?ciudades.join(" "):ciudades].filter(Boolean).join(" | ");
  if(!evidencias.some(e=>e.nivel==="confirmado") && (p=detectar(ubicacionTexto))) evidencias.push({pais:p,nivel:"asociado",fuente:"Ubicación asociada al producto",detalle:ubicacionTexto});

  // 4) Datos de empresa: pista secundaria, nunca fabricación confirmada.
  const empresaTexto=[customer,producer].filter(Boolean).join(" | ");
  if((p=detectar(empresaTexto))) evidencias.push({pais:p,nivel:"asociado",fuente:"Datos de empresa",detalle:empresaTexto});

  // 5) UPCitemdb: sirve para completar identidad del producto y como pista secundaria si contiene país.
  if(upcCountry) evidencias.push({pais:upcCountry,nivel:"asociado",fuente:"UPCitemdb · datos del producto",detalle:upcText});

  // 6) Fuente oficial del fabricante. Tiene prioridad sobre las pistas
  // secundarias porque puede documentar directamente dónde se fabrica/envasa.
  const oficial=evidenciaOficialProducto(codigo,nombre,marca);
  if(oficial) evidencias.unshift(oficial);

  // Si las bases y reglas verificadas no han encontrado fabricación confirmada,
  // intentamos localizar una página del fabricante/brand y extraer evidencia.
  if(!evidencias.some(e=>e.nivel==="confirmado")){
    const webFab=await buscarEvidenciaFabricanteWeb(codigo,nombre,marca);
    if(webFab) evidencias.push(webFab);
  }

  const prioridad={confirmado:4,deducido:3,asociado:2};
  evidencias.sort((a,b)=>(prioridad[b.nivel]||0)-(prioridad[a.nivel]||0));
  const prod=evidencias.find(x=>x.pais)||null;

  let envasado=null;
  if((p=deEmb(sanitario))) envasado={pais:p,fuente:"Código de establecimiento/envasador",nivel:"asociado",detalle:sanitario};
  else if(embInfo) envasado=embInfo;
  else if((p=deEmb(embTags))) envasado={pais:p,fuente:"Código de establecimiento/envasador",nivel:"asociado",detalle:String(embTags)};

  return {nombre,marca,denominacion,cantidad,categoria,fab,ori,oriTags,emb,embTags,embOrig,packaging,customer,producer,ciudades,prod,envasado,evidencias,fuentes:registros.map(x=>x.base),upc,upcCountry};
}

function paisISO3(n){
  const k=String(n||"").padStart(3,"0");
  return ISO_NUM[k] || null;
}
function limpiarGS1(txt){ return String(txt||"").replace(/\u001d/g,"|").replace(/[\u001c\u001e]/g,"|").trim(); }
function extraerGS1(raw){
  const t=limpiarGS1(raw);
  const out={raw:t, gtin:null, origen:null, inicial:null, es2D:false};
  // GS1 Digital Link: https://dominio/.../01/GTIN...?422=724&424=156 etc.
  const mG=t.match(/(?:[?&]|\/)01[=\/]?(\d{14})(?:[&/]|$)/); if(mG) out.gtin=mG[1].replace(/^0+/,'')||mG[1];
  const pairs=[["422","origen"],["423","inicial"]];
  for(const [ai,key] of pairs){
    const re=new RegExp("(?:[?&]|\\\\|\\(|^)"+ai+"[=]?(\\d{3})");
    const m=t.match(re); if(m) out[key]=paisISO3(m[1]) || "Código ISO "+m[1];
  }
  const m416=t.match(/(?:[?&]|\||\()416[=]?(\d{13})/); if(m416) out.glnProduccion=m416[1];
  // GS1 element string: (422)724, (423)724..., (424)156, (426)724, o sin paréntesis con GS.
  for(const [ai,key] of pairs){
    if(out[key]) continue;
    const re=new RegExp("(?:\\("+ai+"\\)|(?:^|[|])"+ai+")(\\d{3})");
    const m=t.match(re); if(m) out[key]=paisISO3(m[1]) || "Código ISO "+m[1];
  }
  out.es2D=!!(out.origen||out.inicial||/^(https?:\/\/)/i.test(t));
  return out;
}
function pintarGS1(raw){

  if(d.origen) h+="🌍 <b>País de origen:</b> "+esc(d.origen)+"<br>";

function normalizarLectura(txt){
  return String(txt||"").trim();
}

function esCodigoBarrasNumerico(txt){
  const s=normalizarLectura(txt);
  return /^(?:\d{8}|\d{12}|\d{13}|\d{14})$/.test(s);
}

function digitoControlValido(codigo){
  const s=normalizarLectura(codigo);
  if(!esCodigoBarrasNumerico(s)) return true; // QR/DataMatrix u otro contenido
  const n=s.length;
  let suma=0;
  for(let i=n-2, pos=0;i>=0;i--,pos++){
    const d=Number(s[i]);
    suma += d * (pos%2===0 ? 3 : 1);
  }
  return ((10-(suma%10))%10)===Number(s[n-1]);
}

    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    ...(Html5QrcodeSupportedFormats.QR_CODE!==undefined?[Html5QrcodeSupportedFormats.QR_CODE]:[]),
    ...(Html5QrcodeSupportedFormats.DATA_MATRIX!==undefined?[Html5QrcodeSupportedFormats.DATA_MATRIX]:[])
  ],verbose:false});

  try{
    const ancho=Math.min(320,Math.max(240,window.innerWidth-64));
    await scanner.start(
      {facingMode:"environment"},
      {fps:15,qrbox:{width:ancho,height:180},aspectRatio:1.7777778},
      async txt=>{
        if(!activo)return;
        const codigo=normalizarLectura(txt);
        if(!codigo)return;

        // Para códigos EAN/UPC exigimos una lectura válida y dos detecciones seguidas.
        if(esCodigoBarrasNumerico(codigo)){
          if(!digitoControlValido(codigo)){
            if(estadoEscaneo)estadoEscaneo.textContent="📷 Leyendo... mantén el código quieto";
            return;
          }
          const ahora=Date.now();
          if(codigo===lecturaPendiente && (ahora-tiempoLectura)<1500) lecturasSeguidas++;
          else { lecturaPendiente=codigo; lecturasSeguidas=1; }
          tiempoLectura=ahora;
          if(lecturasSeguidas<2){
            if(estadoEscaneo)estadoEscaneo.textContent="📷 Confirmando código...";
            return;
          }
        }

        await parar();
        if(navigator.vibrate)navigator.vibrate(150);
        mostrar(codigo);
      },
      ()=>{}
    );
  }catch(e){
    activo=false;
    btn.textContent="Activar cámara";
    if(estadoEscaneo)estadoEscaneo.textContent="📷 No se pudo abrir la cámara. Comprueba el permiso de cámara.";
    alert("No se pudo abrir la cámara. Revisa el permiso de cámara y que la página esté en HTTPS.");
  }
}

const vozBtn = document.getElementById("vozBtn");
if(vozBtn){
  actualizarBotonVoz();
  vozBtn.onclick = () => {
    vozActiva = !vozActiva;
    localStorage.setItem("vozActiva", vozActiva ? "1" : "0");
    if(!vozActiva){
      try{ speechSynthesis.cancel(); }catch(e){}
    }
    actualizarBotonVoz();
  };
}

btn.onclick = () => activo ? parar() : iniciar();
// Activar la cámara automáticamente al abrir la aplicación.
// El navegador mostrará el permiso la primera vez si todavía no está concedido.
window.addEventListener("load", () => { setTimeout(() => iniciar(), 250); }, {once:true});

document.getElementById("ok").onclick = () => mostrar(document.getElementById("manual").value);
</script>
