<!DOCTYPE html>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f5f5f5;color:#222}
  h1{font-size:1.4rem;text-align:center}
  #lector{width:100%;background:#000;border-radius:12px;overflow:hidden;min-height:60px}
  button{width:100%;padding:12px;margin-top:10px;font-size:1rem;border:0;border-radius:10px;background:#1a73e8;color:#fff}
  .fila{display:flex;gap:8px;margin-top:10px}
  input{flex:1;padding:12px;font-size:1rem;border:1px solid #bbb;border-radius:10px}
  .fila button{width:auto;margin:0}
  #resultado{margin-top:16px;padding:16px;background:#fff;border-radius:12px;text-align:center;display:none;border:3px solid transparent}
  #resultado.ok{background:#c9f5cf;border-color:#1e9e3a}
  #resultado.mal{background:#ffd3d3;border-color:#d32f2f}
  #pais{font-size:1.6rem;font-weight:bold;margin:6px 0}
  small{color:#666}
  h2{font-size:1.1rem;margin:22px 0 6px}
  .item{background:#fff;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:.95rem}
  .item small{display:block}
  #borrar{background:#888;padding:8px;font-size:.9rem}
</style>
</head>
<body>
<h1>📦 ¿De qué país es?</h1>
<div id="lector"></div>
<button id="btn">Activar cámara</button>
<div class="fila">
  <input id="manual" inputmode="numeric" placeholder="O escribe el código">
  <button id="ok">Ver</button>
</div>
<div id="resultado">
  <small id="codigo"></small>
  <div id="pais"></div>
  <div id="fabrica" style="margin:10px 0;font-size:1.1rem"></div>
  <small id="origen"></small>
</div>

<h2>🕘 Historial</h2>
<div id="hist"></div>
<button id="borrar">Borrar historial</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// [desde, hasta, país] — prefijos GS1 de 3 dígitos

];

const ISO = {"EE. UU. / Canadá":"US","EE. UU.":"US","Francia":"FR","Bulgaria":"BG","Eslovenia":"SI","Croacia":"HR","Bosnia y Herzegovina":"BA","Alemania":"DE","Japón":"JP","Rusia":"RU","Kirguistán":"KG","Taiwán":"TW","Estonia":"EE","Letonia":"LV","Azerbaiyán":"AZ","Lituania":"LT","Uzbekistán":"UZ","Sri Lanka":"LK","Filipinas":"PH","Bielorrusia":"BY","Ucrania":"UA","Moldavia":"MD","Armenia":"AM","Georgia":"GE","Kazajistán":"KZ","Hong Kong":"HK","Reino Unido":"GB","Grecia":"GR","Líbano":"LB","Chipre":"CY","Albania":"AL","Macedonia del Norte":"MK","Malta":"MT","Irlanda":"IE","Bélgica / Luxemburgo":"BE","Portugal":"PT","Islandia":"IS","Dinamarca":"DK","Polonia":"PL","Rumanía":"RO","Hungría":"HU","Sudáfrica":"ZA","Ghana":"GH","Baréin":"BH","Mauricio":"MU","Marruecos":"MA","Argelia":"DZ","Kenia":"KE","Costa de Marfil":"CI","Túnez":"TN","Siria":"SY","Egipto":"EG","Libia":"LY","Jordania":"JO","Irán":"IR","Kuwait":"KW","Arabia Saudí":"SA","Emiratos Árabes Unidos":"AE","Finlandia":"FI","China":"CN","Noruega":"NO","Israel":"IL","Suecia":"SE","Guatemala":"GT","El Salvador":"SV","Honduras":"HN","Nicaragua":"NI","Costa Rica":"CR","Panamá":"PA","República Dominicana":"DO","México":"MX","Canadá":"CA","Venezuela":"VE","Suiza":"CH","Colombia":"CO","Uruguay":"UY","Perú":"PE","Bolivia":"BO","Argentina":"AR","Chile":"CL","Paraguay":"PY","Ecuador":"EC","Brasil":"BR","Italia":"IT","España":"ES","Cuba":"CU","Eslovaquia":"SK","Chequia":"CZ","Serbia":"RS","Mongolia":"MN","Corea del Norte":"KP","Turquía":"TR","Países Bajos":"NL","Corea del Sur":"KR","Camboya":"KH","Tailandia":"TH","Singapur":"SG","India":"IN","Vietnam":"VN","Pakistán":"PK","Indonesia":"ID","Austria":"AT","Australia":"AU","Nueva Zelanda":"NZ","Malasia":"MY","Macao":"MO"};
function bandera(nombre){
  const c = ISO[nombre];
  return c ? String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0))) : "🌍";
}

// Historial (se guarda en el propio móvil)
function cargarHist(){ try{ return JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){ return []; } }
function guardar(codigo, pais, fab){
  const h = cargarHist().filter(x => x.codigo !== codigo);
  h.unshift({codigo, pais, fab, fecha:new Date().toLocaleString("es-ES")});
  try{ localStorage.setItem("hist", JSON.stringify(h.slice(0,50))); }catch(e){}
  pintarHist();
}
function pintarHist(){
  const h = cargarHist();
  document.getElementById("hist").innerHTML = h.length
    ? h.map(x => '<div class="item">'+bandera(x.pais)+' <b>'+x.pais+'</b>'+(x.fab?' · 🏭 '+x.fab:'')+'<small>'+x.codigo+' · '+x.fecha+'</small></div>').join("")
    : '<small>Aún no has escaneado nada.</small>';
}
document.getElementById("borrar").onclick = () => { try{ localStorage.removeItem("hist"); }catch(e){} pintarHist(); };
pintarHist();

function paisDe(codigo){
  const c = codigo.replace(/\D/g,"");
  if(c.length < 8) return null;
  // UPC-A (12 dígitos) equivale a EAN-13 con un 0 delante
  const ean = c.length === 12 ? "0"+c : c;
  const p = parseInt(ean.slice(0,3),10);
  const f = R.find(([a,b]) => p>=a && p<=b);
  return f ? f[2] : "Desconocido / código especial";
}

function hablar(texto){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    speechSynthesis.speak(u);
  }catch(e){}
}
// Chrome solo deja hablar tras un toque del usuario: lo "desbloqueamos" con el primero
window.addEventListener("pointerdown", () => {
  try{ const u = new SpeechSynthesisUtterance(""); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}, {once:true});

async function mostrar(codigo){
  const pais = paisDe(codigo);
  document.getElementById("resultado").style.display = "block";
  document.getElementById("codigo").textContent = "Código: " + codigo;
  document.getElementById("pais").textContent = pais ? bandera(pais) + " " + pais : "Código no válido";
  const cuadro = document.getElementById("resultado");
  cuadro.className = !pais ? "" : (pais === "España" ? "ok" : "mal");
  if(pais === "España") hablar("Perfecto");
  else if(pais) hablar("No es de España. Es de " + pais.split(" / ")[0]);
  else hablar("Código no válido");
  const o = document.getElementById("origen");
  o.textContent = pais ? "El prefijo indica dónde se registró la marca, no siempre dónde se fabricó." : "";
  if(!pais) return;
  const f = document.getElementById("fabrica");
  f.textContent = "🔎 Buscando dónde se fabricó...";
  const bases = ["openfoodfacts","openbeautyfacts","openproductsfacts"];
  let fab = "", ori = "", nombre = "";
  for(const b of bases){
    try{
      const r = await fetch("https://world."+b+".org/api/v2/product/"+codigo+".json?fields=product_name,manufacturing_places,origins");
      const d = await r.json();
      if(d.status === 1 && d.product){
        nombre = nombre || d.product.product_name || "";
        fab = fab || d.product.manufacturing_places || "";
        ori = ori || d.product.origins || "";
        if(fab) break;
      }
    }catch(e){}
  }
  const partes = [];
  if(fab) partes.push("🏭 Fabricado en: " + fab);
  if(ori) partes.push("🌾 Origen de ingredientes: " + ori);
  if(partes.length){
    f.innerHTML = (nombre ? "<b>"+nombre+"</b><br>" : "") + partes.join("<br>");
  }else{
    f.textContent = "🏭 No hay datos de fabricación para este producto en las bases abiertas.";
  }
  guardar(codigo, pais, fab);
}

let scanner, activo = false, ultimo = "";
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const btn = document.getElementById("btn");
async function parar(){
  if(!activo) return;
  activo = false;
  try{ await scanner.stop(); scanner.clear(); }catch(e){}
  btn.textContent = "📷 Escanear otro";
}
async function iniciar(){
  if(activo) return;
  activo = true;
  btn.textContent = "Parar cámara";
  scanner = new Html5Qrcode("lector", {
    formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E],
    experimentalFeatures: {useBarCodeDetectorIfSupported: true},
    verbose: false
  });
  try{
    await scanner.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:260,height:140}},
      async txt => {
        if(!activo) return;
        await parar();
        if(navigator.vibrate) navigator.vibrate(150);
        mostrar(txt);
      }
    );
  }catch(e){
    activo = false;
    btn.textContent = "Activar cámara";
    alert("No se pudo abrir la cámara. Revisa los permisos (hace falta https).");
  }
}
btn.onclick = () => activo ? parar() : iniciar();
window.addEventListener("load", iniciar);
document.getElementById("ok").onclick = () => mostrar(document.getElementById("manual").value);
</script>
</body>
