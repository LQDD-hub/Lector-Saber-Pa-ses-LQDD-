function bandera(nombre){
  const c = ISO[nombre];
  return c ? String.fromCodePoint(...[...c].map(x => 127397 + x.charCodeAt(0))) : "🌍";

// Historial (se guarda en el propio móvil)
function cargarHist(){ try{ return JSON.parse(localStorage.getItem("hist")||"[]"); }catch(e){ return []; } }
function guardar(codigo, pais, fab){
  const h = cargarHist().filter(x => x.codigo !== codigo);
  h.unshift({codigo, pais, fab, fecha:new Date().toLocaleString("es-ES")});
  try{ localStorage.setItem("hist", JSON.stringify(h.slice(0,50))); }catch(e){}
  pintarHist();
}
function pintarHist(){
  const h = cargarHist();
  document.getElementById("hist").innerHTML = h.length
    ? h.map(x => '<div class="item">'+bandera(x.pais)+' <b>'+x.pais+'</b>'+(x.fab?(x.fab.indexOf('según')===0?' · 🏷️ ':' · 🏭 ')+x.fab:'')+'<small>'+x.codigo+' · '+x.fecha+'</small></div>').join("")
    : '<small>Aún no has escaneado nada.</small>';
}
document.getElementById("borrar").onclick = () => { try{ localStorage.removeItem("hist"); }catch(e){} pintarHist(); };
pintarHist();

function paisDe(codigo){
  const c = codigo.replace(/\D/g,"");
  if(c.length < 8) return null;
  // UPC-A (12 dígitos) equivale a EAN-13 con un 0 delante
  const ean = c.length === 12 ? "0"+c : c;
  const p = parseInt(ean.slice(0,3),10);
  const f = R.find(([a,b]) => p>=a && p<=b);
  return f ? f[2] : "Desconocido / código especial";
}

const EMB = {AT:"Austria",BE:"Bélgica",BG:"Bulgaria",CY:"Chipre",CZ:"Chequia",DE:"Alemania",DK:"Dinamarca",EE:"Estonia",ES:"España",FI:"Finlandia",FR:"Francia",GR:"Grecia",HR:"Croacia",HU:"Hungría",IE:"Irlanda",IT:"Italia",LT:"Lituania",LU:"Bélgica / Luxemburgo",LV:"Letonia",MT:"Malta",NL:"Países Bajos",PL:"Polonia",PT:"Portugal",RO:"Rumanía",SE:"Suecia",SI:"Eslovenia",SK:"Eslovaquia",GB:"Reino Unido",UK:"Reino Unido"};
const norm = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Busca el primer país que aparece nombrado en un texto libre
function detectar(texto){
  const t = norm(texto);
  let mejor = null, pos = 1e9;
  for(const [pais, alias] of ALIAS){
    for(const a of alias){
      const m = new RegExp("(^|[^a-z])"+a.replace(/[.]/g,"\\.")+"([^a-z]|$)").exec(t);
      if(m && m.index < pos){ pos = m.index; mejor = pais; }
    }
  }
  return mejor;
}
// Código de envasador/sanitario de la UE: "ES 10.02547/H CE", "FR 35.123.001 CE", "EMB 35123"
function deEmb(texto){
  // EMB es un código de trazabilidad del envasador. Solo inferimos país
  // cuando aparece explícitamente un código de país de 2 letras.
  const t = String(texto||"").toUpperCase();
  const m = t.match(/(?:^|[^A-Z])([A-Z]{2})\s?[.\d]/);
  return (m && EMB[m[1]]) || null;
}
// Etiquetas tipo "en:made-in-spain"
function deEtiqueta(tags){
  for(const t of (tags||[])){
    const m = String(t).match(/made-in-([a-z-]+)/);
    if(m){ const p = detectar(m[1].replace(/-/g," ")); if(p) return p; }
  }
  return null;
}

function paisDeTags(tags){
  if(!Array.isArray(tags)) return null;
  for(const tag of tags){
    const raw=String(tag||"").toLowerCase();
    const limpio=raw.replace(/^([a-z]{2}):/i,"").replace(/^made-in-/,"").replace(/-/g," ");
    const p=detectar(limpio);
    if(p && p!=="Unión Europea") return p;
  }
  return null;
}

    const t = setTimeout(() => ac.abort(), 7000);
    try{
      const url="https://world."+base+".org/api/v3/product/"+encodeURIComponent(codigo)+"?lc=es&cc=es&fields="+encodeURIComponent(campos);
      const r=await fetch(url,{signal:ac.signal});
      if(!r.ok) continue;
      const d=await r.json();
      if(!d || !d.product) continue;
      const p=d.product;
      const tieneDato = [
        "product_name","generic_name","brands","quantity","categories",
        "manufacturing_places","origins","origin","emb_codes","countries"
      ].some(k=>p[k] && (!Array.isArray(p[k]) || p[k].length));
      if(!tieneDato) continue;

      const nombre=p.product_name || p.abbreviated_product_name || p.generic_name || "";
      const fab=p.manufacturing_places || "";
      const fabTags=p.manufacturing_places_tags || [];
      const labels=p.labels_tags || [];
      const ori=p.origins || p.origin || "";
      const emb=p.emb_codes || "";

      let prod=null, x;
      if((x=detectar(fab))) prod={pais:x,fuente:nombreBase+" · lugar de fabricación"};
      else if((x=paisDeTags(fabTags))) prod={pais:x,fuente:nombreBase+" · lugar de fabricación"};
      else if((x=deEtiqueta(labels))) prod={pais:x,fuente:nombreBase+" · etiqueta declarada"};

      let envasado=null;
      if((x=deEmb(emb))) envasado={pais:x,fuente:nombreBase+" · código EMB"};

      return {
        fuente:nombreBase,
        nombre,
        nombreLegal:p.generic_name || "",
        marca:p.brands || "",
        cantidad:p.quantity || "",
        categorias:p.categories || "",
        paisesVenta:p.countries || "",
        fab,
        ori,
        emb,
        prod,
        envasado,
        packagingText:p.packaging_text || "",
        packaging:p.packaging || ""
      };
    }catch(e){
      // Probamos la siguiente base.
    }finally{ clearTimeout(t); }
  }
  return {
    fuente:"",
    nombre:"",nombreLegal:"",marca:"",cantidad:"",categorias:"",paisesVenta:"",
    fab:"",ori:"",emb:"",prod:null,envasado:null,packagingText:"",packaging:""
  };
}

// ---------- Datos GS1 2D: origen, procesamiento y localización ----------
const ISO_NUM = {
  "008":"Bahrein","032":"Argentina","036":"Australia","040":"Austria","056":"Bélgica",
  "076":"Brasil","100":"Bulgaria","124":"Canadá","152":"Chile","156":"China","170":"Colombia",
  "191":"Croacia","196":"Chipre","203":"Chequia","208":"Dinamarca","214":"República Dominicana",
  "218":"Ecuador","222":"El Salvador","233":"Estonia","246":"Finlandia","250":"Francia",
  "276":"Alemania","300":"Grecia","320":"Guatemala","328":"Guyana","348":"Hungría",
  "356":"India","360":"Indonesia","372":"Irlanda","376":"Israel","380":"Italia","392":"Japón",
  "398":"Kazajistán","400":"Jordania","404":"Kenia","410":"Corea del Sur","414":"Kuwait",
  "422":"Líbano","428":"Letonia","440":"Lituania","442":"Luxemburgo","458":"Malasia",
  "462":"Irán","470":"Malta","484":"México","496":"Mongolia","498":"Moldavia","504":"Marruecos",
  "528":"Países Bajos","554":"Nueva Zelanda","566":"Nigeria","578":"Noruega","586":"Pakistán",
  "591":"Panamá","604":"Perú","620":"Portugal","642":"Rumanía","643":"Rusia","682":"Arabia Saudí",
  "688":"Serbia","702":"Singapur","704":"Vietnam","710":"Sudáfrica","724":"España",
  "752":"Suecia","756":"Suiza","760":"Siria","764":"Tailandia","780":"Emiratos Árabes Unidos",
  "788":"Túnez","792":"Turquía","800":"Uganda","807":"Macedonia del Norte","818":"Egipto",
  "826":"Reino Unido","834":"Tanzania","840":"Estados Unidos","858":"Eslovaquia","860":"Serbia",
  "862":"Venezuela","882":"Samoa","887":"Yemen","894":"Zambia"
};
function paisISO3(n){
  const k=String(n||"").padStart(3,"0");
  return ISO_NUM[k] || null;
}
function limpiarGS1(txt){ return String(txt||"").replace(/\u001d/g,"|").replace(/[\u001c\u001e]/g,"|").trim(); }
function extraerGS1(raw){
  const t=limpiarGS1(raw);
  const out={raw:t,gtin:null,origen:null,inicial:null,es2D:false};
  // GS1 Digital Link: /01/GTIN...?422=724&423=724
  const mG=t.match(/(?:[?&]|\/)01[=\/]?(\d{14})(?:[&/]|$)/);
  if(mG) out.gtin=mG[1].replace(/^0+/,'')||mG[1];

  // Solo mostramos los AIs que hemos decidido usar en la app:
  // 422 = país de origen; 423 = país de procesamiento inicial.
  for(const [ai,key] of [["422","origen"],["423","inicial"]]){
    let m=t.match(new RegExp("(?:[?&|\\(]|^)"+ai+"[=]?(\\d{3})"));
    if(m) out[key]=paisISO3(m[1]) || "Código ISO "+m[1];
  }
  out.es2D=!!(out.origen||out.inicial||/^(https?:\/\/)/i.test(t)||/\(422\)|\(423\)|(?:^|[|])(?:422|423)\d{3}/.test(t));
  return out;
}
function pintarGS1(raw){
  const box=$("gs1Datos"); if(!box) return null;
  const d=extraerGS1(raw); let h="";
  if(d.gtin) h+="🔢 <b>GTIN:</b> "+esc(d.gtin)+"<br>";
  if(d.origen) h+='<div class="dato-pais">🌍 <b>País de origen:</b> '+esc(d.origen)+'<div class="fuente">GS1 · AI 422</div></div>';
  if(d.inicial) h+='<div class="dato-pais">🧪 <b>País de procesamiento inicial:</b> '+esc(d.inicial)+'<div class="fuente">GS1 · AI 423</div></div>';
  if(!h && d.es2D) h='📦 <b>QR/DataMatrix GS1 detectado</b><br><small>Este código no contiene los datos de origen (AI 422) ni de procesamiento inicial (AI 423).</small>';
  box.innerHTML=h ? '<div style="padding:10px;background:#fff7d6;border-radius:10px;border:1px solid #e0c45c">'+h+'</div>' : '';
  return d;
}

function pintar(){
  const {codigo,prefijo,info}=actual, cuadro=$("resultado");
  const gs1=pintarGS1(actual.gs1Raw||"");
  // Si el código 2D no trae AI 422, mostramos el campo de origen de la base
  // como dato aparte y con su significado real, sin convertirlo en fabricación.
  if(!gs1.origen && info.ori){
    const box=$("gs1Datos");
    const previo=box.innerHTML;
    const extra='<div class="dato-pais">🌍 <b>País de origen:</b> '+esc(info.ori)+'<div class="fuente">Origen declarado en la base de datos; puede referirse al origen de ingredientes.</div></div>';
    box.innerHTML=previo ? previo.replace('</div></div>','</div></div>')+extra : '<div style="padding:10px;background:#fff7d6;border-radius:10px;border:1px solid #e0c45c">'+extra+'</div>';
  }
  const paisPrefijo=prefijo==="España / Andorra"?"España":prefijo;
  const paisFab=info.prod?(info.prod.pais==="España / Andorra"?"España":info.prod.pais):null;
  const tieneFabricacion=!!paisFab, desconocido=!paisPrefijo||paisPrefijo.startsWith("Desconocido");

  $("pais").textContent=desconocido?"🌍 País GS1 desconocido":bandera(paisPrefijo)+" "+paisPrefijo;
  let frase=""; cuadro.className="";
  if(!desconocido){ frase=paisPrefijo==="España"?"¡Viva España!":(paisPrefijo==="Marruecos"?"¡No, no, no, Marruecos no!":"¡No!"); cuadro.className=paisPrefijo==="España"?"ok":"mal"; }
  $("frase").textContent=frase;

  // 1) País del prefijo GS1 + 2) fabricación + 3) envasador.
  let html='<div class="dato-pais">🏷️ <b>País del prefijo GS1:</b> '+esc(paisPrefijo)+'<div class="fuente">El prefijo GS1 indica dónde se asignó el número, no necesariamente dónde se fabricó.</div></div>';
  if(tieneFabricacion){
    const mismo=norm(paisPrefijo)===norm(paisFab);
    html+='<div class="dato-pais">'+(mismo?'✅':'⚠️')+' <b>País donde se fabricó:</b> '+esc(paisFab)+'<div class="fuente">'+esc(info.prod.fuente)+'</div></div>';
    $("fabricadoEn").textContent=mismo?"✅ Fabricado en "+paisFab:"⚠️ Prefijo GS1: "+paisPrefijo+" · Fabricado en "+paisFab;
  }else if(info.fab){
    html+='<div class="dato-pais">🏭 <b>Lugar de fabricación registrado:</b> '+esc(info.fab)+'<div class="fuente">La base de datos no permite identificar con seguridad el país.</div></div>';
    $("fabricadoEn").textContent="🏭 País de fabricación: no disponible";
  }else{
    html+='<div class="dato-pais">🏭 <b>País donde se fabricó:</b> no disponible</div>';
    $("fabricadoEn").textContent="🏭 País de fabricación: no disponible";
  }
  if(info.envasado){
    html+='<div class="dato-pais">📦 <b>País asociado al código del envasador:</b> '+esc(info.envasado.pais)+'<div class="fuente">'+esc(info.envasado.fuente)+' · no sustituye a una declaración explícita de país de envasado</div></div>';
  }else if(info.emb){
    html+='<div class="dato-pais">📦 <b>País del envasador:</b> no disponible<div class="fuente">Código registrado: '+esc(info.emb)+'</div></div>';
  }else{
    html+='<div class="dato-pais">📦 <b>País del envasador:</b> no disponible</div>';
  }
  $("fabrica").innerHTML=html;

  // Información del producto: mostramos todo lo que la base de datos realmente tenga.
  const pd=$("productoDatos");
  let ph='';
  if(info.nombre) ph+='<div class="linea">💧 <b>Producto:</b> '+esc(info.nombre)+'</div>';
  if(info.nombreLegal && norm(info.nombreLegal)!==norm(info.nombre)) ph+='<div class="linea">📄 <b>Denominación:</b> '+esc(info.nombreLegal)+'</div>';
  if(info.marca) ph+='<div class="linea">🏷️ <b>Marca:</b> '+esc(info.marca)+'</div>';
  if(info.cantidad) ph+='<div class="linea">⚖️ <b>Cantidad:</b> '+esc(info.cantidad)+'</div>';
  if(info.categorias) ph+='<div class="linea">🗂️ <b>Categoría:</b> '+esc(info.categorias)+'</div>';
  if(info.packagingText) ph+='<div class="linea">📦 <b>Información de envase:</b> '+esc(info.packagingText)+'</div>';
  if(!ph) ph='<div>ℹ️ No hay más datos públicos del producto asociados a este código.</div>';
  if(info.fuente) ph+='<div class="fuente" style="margin-top:8px">Fuente de ficha de producto: '+esc(info.fuente)+'</div>';
  pd.innerHTML=ph;

  if(paisPrefijo==="España") fanfarriaEspana(); if(paisPrefijo==="Marruecos") pitidoEmergencia();
  const partes=[];
  if(!desconocido) partes.push("El prefijo GS1 corresponde a "+paisPrefijo);
  if(tieneFabricacion) partes.push("la fabricación figura en "+paisFab);
  else partes.push("no hay un país de fabricación confirmado");
  hablar((frase?frase+" ":"")+partes.join(", ")+".");
  guardar(codigo,desconocido?"Desconocido":paisPrefijo,tieneFabricacion?"fabricado en "+paisFab:"prefijo GS1");
}

const btn = document.getElementById("btn");
const estadoEscaneo = document.getElementById("estadoEscaneo");
let scanner, activo=false, ultimo="";
let lecturaPendiente="", lecturasSeguidas=0, ultimaLecturaT=0;

function digitoControlEAN(codigo){
  const c=String(codigo||"").replace(/\D/g,"");
  if(!/^(?:\d{8}|\d{12}|\d{13}|\d{14})$/.test(c)) return null;
  const base=c.slice(0,-1);
  let suma=0, pos=0;
  for(let i=base.length-1;i>=0;i--,pos++){
    suma += Number(base[i]) * (pos%2===0 ? 3 : 1);
  }
  return (10-(suma%10))%10;
}
function esCodigoNumericoValido(codigo){
  const c=String(codigo||"").replace(/\D/g,"");
  const dc=digitoControlEAN(c);
  return dc===null || Number(c[c.length-1])===dc;
}
function limpiarLectura(txt){
  const raw=String(txt||"").trim();
  return /^\d{8,14}$/.test(raw.replace(/\D/g,"")) ? raw.replace(/\D/g,"") : raw;
}

async function parar(){
  if(!activo)return; activo=false;
  try{await scanner.stop();scanner.clear();}catch(e){}
  btn.textContent="📷 Escanear otro";
  if(estadoEscaneo)estadoEscaneo.textContent="📷 Escanea el código para identificarlo";
}

async function iniciar(){
  if(activo)return; activo=true;
  btn.textContent="Parar cámara";
  if(estadoEscaneo)estadoEscaneo.textContent="📷 Buscando código...";
  scanner=new Html5Qrcode("lector",{formatsToSupport:[
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    ...(Html5QrcodeSupportedFormats.QR_CODE!==undefined?[Html5QrcodeSupportedFormats.QR_CODE]:[]),
    ...(Html5QrcodeSupportedFormats.DATA_MATRIX!==undefined?[Html5QrcodeSupportedFormats.DATA_MATRIX]:[])
  ],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},async txt=>{
      if(!activo)return;
      const lectura=limpiarLectura(txt);
      const ahora=Date.now();
      const numerica=/^\d{8,14}$/.test(lectura);
      if(numerica && !esCodigoNumericoValido(lectura)){
        if(estadoEscaneo)estadoEscaneo.textContent="⚠️ Lectura de código no válida. Mantén la cámara quieta...";
        return;
      }
      if(numerica){
        if(lectura===lecturaPendiente && ahora-ultimaLecturaT<1500) lecturasSeguidas++;
        else { lecturaPendiente=lectura; lecturasSeguidas=1; }
        ultimaLecturaT=ahora;
        if(lecturasSeguidas<2){
          if(estadoEscaneo)estadoEscaneo.textContent="📷 Confirmando código...";
          return;
        }
      }
      await parar();
      lecturaPendiente=""; lecturasSeguidas=0; ultimaLecturaT=0;
      if(navigator.vibrate)navigator.vibrate(150);
      mostrar(lectura);
    });
  }catch(e){
    activo=false; btn.textContent="Activar cámara";
    if(estadoEscaneo)estadoEscaneo.textContent="📷 Escanea el código para identificarlo";
    alert("No se pudo abrir la cámara. Revisa los permisos (hace falta https).");
  }
}
